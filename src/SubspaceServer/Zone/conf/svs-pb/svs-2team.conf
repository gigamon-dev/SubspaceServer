;; A close approximation of PowerBall Zone settings
;;
;; This variation is for when there are only two teams (Warbirds vs Javelins)
;; where the Warbirds have L3 guns (blue) and Javelins have L2 guns (yellow). 
;; The gun level difference is only for visual purposes, to help players differentiate enemy fire from friendly fire.
;; The guns cost the same amount to fire and do the same amount of damage.
;;
;; BulletCost = BulletFireEnergy * BulletLevel
;;  (Warbird) = 20 * 3
;;  (Javelin) = 30 * 2
;;            = 60
;; 
;; MultiFireBulletCost = MultiFireEnergy * BulletLevel
;;           (Warbird) = 30 * 3 
;;           (Javelin) = 45 * 2
;;                     = 90

#include conf/svs-pb/svs.conf

[Warbird]
BulletFireEnergy=20
MultiFireEnergy=30
MaxGuns=3
InitialGuns=3

[Javelin]
BulletFireEnergy=30
MultiFireEnergy=45
MaxGuns=2
InitialGuns=2

;; NOTE: The following should already be set. This is here to emphasize that it must be configured this way for the above settings to work.
[Bullet]
BulletDamageUpgrade=0
